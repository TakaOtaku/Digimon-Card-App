name: Update Alysion Cards

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

# Shared with "Update Cards": both write the same card JSON files and push.
concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update-alysion-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/python/requirements.txt

      - name: Create required directories
        run: |
          mkdir -p scripts/python/Wiki/digimon-images/converted
          mkdir -p scripts/python/Wiki/jsons
          mkdir -p src/assets/images/cards

      - name: Run Alysion card pipeline
        env: &garage-env
          GARAGE_ENDPOINT_URL: ${{ secrets.GARAGE_ENDPOINT_URL }}
          GARAGE_BUCKET: ${{ secrets.GARAGE_BUCKET }}
          GARAGE_ACCESS_KEY_ID: ${{ secrets.GARAGE_ACCESS_KEY_ID }}
          GARAGE_SECRET_ACCESS_KEY: ${{ secrets.GARAGE_SECRET_ACCESS_KEY }}
          GARAGE_REGION: ${{ vars.GARAGE_REGION || 'garage' }}
          GARAGE_ADDRESSING_STYLE: ${{ vars.GARAGE_ADDRESSING_STYLE || 'path' }}
          GARAGE_KEY_PREFIX: ${{ vars.GARAGE_KEY_PREFIX }}
          WIKI_WORKERS: ${{ vars.WIKI_WORKERS || '4' }}
        run: |
          if [ -z "$GARAGE_BUCKET" ]; then
            echo "::error::Garage secrets are missing; the pipeline would treat every card image as missing."
            exit 1
          fi
          python scripts/python/Wiki/GetAlysionDataFromWiki.py

      - name: Upload missing card images to Garage
        env: *garage-env
        run: |
          if ls src/assets/images/cards/*.webp >/dev/null 2>&1; then
            python scripts/python/garage_sync.py --apply
          else
            echo "No new card images to upload."
          fi

      - name: Check for changes
        id: git_status
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected."
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git config --local user.email "digimoncard.app@gmail.de"
          git config --local user.name "DigimonCardApp"
          git add -A
          git commit -m "[Automatic] Update Alysion Cards"
          git pull --rebase
          git push

      # Pushes made with GITHUB_TOKEN don't trigger workflows, but workflow_dispatch does.
      - name: Build and deploy the new card data
        if: steps.git_status.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-coolify.yaml --ref "$GITHUB_REF_NAME"
